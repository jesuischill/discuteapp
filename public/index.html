<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DiscuteApp</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="authScreen">
    <section class="auth-card">
      <h1>💬 DiscuteApp</h1>
      <p>Discute avec la communauté.</p>

      <input id="username" placeholder="Pseudo">
      <input id="password" type="password" placeholder="Mot de passe">

      <button onclick="register()">Créer un compte</button>
      <button class="secondary" onclick="login()">Se connecter</button>

      <p id="authError"></p>
    </section>
  </main>

  <main id="appScreen" class="hidden">
    <aside>
      <h2>💬 DiscuteApp</h2>
      <p id="currentUser"></p>

      <button onclick="showPublic()">🌍 Chat public</button>
      <button onclick="showRequests()">🔔 Demandes</button>
      <button onclick="showUsers()">👥 Utilisateurs</button>
      <button id="adminButton" class="hidden" onclick="showAdmin()">🛡️ Admin</button>

      <hr>

      <h3>Discussions privées</h3>
      <div id="conversations"></div>

      <button onclick="logout()">Déconnexion</button>
    </aside>

    <section id="content">
      <h1>Bienvenue sur DiscuteApp</h1>
      <p>Choisis une discussion.</p>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
