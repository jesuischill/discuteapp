<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Échange · DiscuteApp</title><style>
body{margin:0;font-family:Arial;background:#0b1020;color:#fff}main{max-width:1000px;margin:auto;padding:24px}.top,.footer{padding:16px;border-radius:16px;background:#151d35}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}.side{padding:18px;border:1px solid #334155;border-radius:16px;background:#111827}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{padding:10px;border:1px solid #475569;border-radius:10px;background:#1e293b;cursor:pointer}.item.selected{border-color:#facc15;background:#713f12}.item.other{cursor:default;opacity:.8}input,button{padding:12px;border-radius:10px;border:0;font-size:16px}input{width:120px}button{font-weight:bold;background:#facc15;cursor:pointer}button.ready{background:#22c55e}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="top"><h1>🤝 Échange</h1><p id="status">Chargement…</p></div><div class="grid"><section class="side"><h2>Ton offre</h2><p>💎 Gemmes : <input id="gems" type="number" min="0" value="0"></p><h3>Choisis tes accessoires</h3><div class="items" id="mine"></div></section><section class="side"><h2 id="otherTitle">Son offre</h2><p id="otherGems">💎 Gemmes : 0</p><h3>Ses accessoires</h3><div class="items" id="other"></div></section></div><div class="footer"><button id="save">Mettre à jour l’offre</button> <button id="confirm">✅ Prêt / Confirmer</button><p>Chaque modification annule les confirmations. Le transfert n’a lieu que lorsque vous avez tous les deux confirmé.</p></div></main><script>
const token=localStorage.getItem("discuteapp_token"),id=new URLSearchParams(location.search).get("id");let items=[],trade;
async function api(url,o={}){const r=await fetch(url,{...o,headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`,...(o.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||"Erreur");return d}
function names(){return trade.mine==="from"?trade.to_username:trade.from_username}
function render(){document.querySelector("#otherTitle").textContent=`Offre de ${names()}`;document.querySelector("#otherGems").textContent=`💎 Gemmes : ${trade[trade.other+"_gems"]}`;document.querySelector("#status").textContent=trade.myConfirmed?`✅ Tu es prêt. ${trade.otherConfirmed?"Échange en cours…":"En attente de l’autre personne."}`:"Choisis ton offre puis confirme.";const selected=new Set(trade.myItems);mine.replaceChildren(...items.map(x=>{const b=document.createElement("button");b.className="item "+(selected.has(x.id)?"selected":"");b.textContent=x.item_name;b.onclick=()=>{selected.has(x.id)?selected.delete(x.id):selected.add(x.id);trade.myItems=[...selected];render()};return b}));const theirs=JSON.parse(trade[trade.other+"_items"]||"[]");other.replaceChildren(...theirs.map(x=>{const b=document.createElement("div");b.className="item other";b.textContent=`Accessoire #${x}`;return b}));confirm.className=trade.myConfirmed?"ready":"";confirm.textContent=trade.myConfirmed?"✅ Offre confirmée":"✅ Prêt / Confirmer"}
async function load(){try{trade=await api(`/api/trades/${id}`);items=await api("/api/accessories");render()}catch(e){status.textContent="❌ "+e.message}}
save.onclick=async()=>{await api(`/api/trades/${id}/offer`,{method:"PUT",body:JSON.stringify({gems:gems.value,itemIds:trade.myItems})});await load()};
confirm.onclick=async()=>{const r=await api(`/api/trades/${id}/confirm`,{method:"POST"});if(r.completed){status.textContent="🎉 Échange terminé !";setTimeout(()=>location.href="/",1200)}else await load()};
load();setInterval(load,3000);
</script></body></html>
