<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤖 Discutebot - DiscuteApp</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0f0d;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bot {
      width: min(900px, 95%);
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: #111815;
      border: 1px solid #26352d;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 255, 120, .08);
    }

    .header {
      padding: 18px 22px;
      background: #151e19;
      border-bottom: 1px solid #26352d;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 5px 0 0;
      color: #8fa79a;
      font-size: 14px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .bot-message {
      align-self: flex-start;
      background: #1b2921;
      border: 1px solid #2b4034;
    }

    .user-message {
      align-self: flex-end;
      background: #176b3a;
    }

    .admin-message {
      align-self: center;
      width: min(90%, 700px);
      background: #3b2f08;
      border: 1px solid #eab308;
      color: #fde68a;
      text-align: center;
      font-weight: bold;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #26352d;
      background: #151e19;
    }

    #messageInput {
      flex: 1;
      padding: 13px 15px;
      border: 1px solid #34483d;
      border-radius: 12px;
      background: #0d130f;
      color: white;
      outline: none;
      font-size: 15px;
    }

    #sendButton {
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      background: #20c765;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton:hover {
      filter: brightness(1.1);
    }

    #sendButton:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <main class="bot">
    <header class="header">
      <h1>🤖 Discutebot</h1>
      <p>Ton assistant DiscuteApp</p>
    </header>

    <section id="messages">
      <div class="message bot-message">
        Salut ! 👋 Je suis Discutebot. Comment puis-je t'aider ?
      </div>
    </section>

    <form class="input-area" id="chatForm">
      <input
        id="messageInput"
        type="text"
        maxlength="500"
        placeholder="Écris ton message..."
        autocomplete="off"
        required
      >

      <button id="sendButton" type="submit">
        Envoyer
      </button>
    </form>
  </main>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");

    let knownMessageIds = new Set();

    function addMessage(text, type, id = null) {
      if (id !== null) {
        if (knownMessageIds.has(id)) return;
        knownMessageIds.add(id);
      }

      const div = document.createElement("div");
      div.className = `message ${type}-message`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function renderHistory(list) {
      for (const item of list) {
        if (item.sender === "user") addMessage(item.message, "user", item.id);
        else if (item.sender === "bot") addMessage(item.message, "bot", item.id);
        else if (item.sender === "admin") addMessage("📢 Admin : " + item.message, "admin", item.id);
      }
    }

    async function loadHistory() {
      try {
        const response = await fetch("/api/discutebot/history", {
          credentials: "include"
        });

        if (!response.ok) return;

        const data = await response.json();
        renderHistory(data.messages || []);
      } catch (_) {}
    }

    async function pollAdminMessages() {
      try {
        const response = await fetch("/api/discutebot/history", {
          credentials: "include"
        });

        if (!response.ok) return;

        const data = await response.json();
        renderHistory(data.messages || []);
      } catch (_) {}
    }

    loadHistory();
    setInterval(pollAdminMessages, 2000);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();

      if (!message) return;

      input.value = "";
      button.disabled = true;

      try {
        const response = await fetch("/api/discutebot", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Erreur du serveur.");
        }

      } catch (error) {
        addMessage("❌ " + error.message, "bot");
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>

</body>
</html>
