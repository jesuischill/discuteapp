<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 Quiz - DiscuteApp</title>
  <link rel="stylesheet" href="/style.css">
  <style>
html, body {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 30px 15px;
  box-sizing: border-box;
  color: #fff;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 15% 20%, rgba(0,255,255,.10), transparent 28%),
    radial-gradient(circle at 85% 15%, rgba(255,0,180,.10), transparent 28%),
    radial-gradient(circle at 50% 90%, rgba(120,0,255,.12), transparent 35%),
    #050510;
}

#quizDisabledScreen {
  min-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

#quizDisabledScreen .maintenance-card {
  max-width: 520px;
  padding: 35px;
  border: 1px solid #334155;
  border-radius: 18px;
  background: #111827;
  box-shadow: 0 0 20px rgba(0,0,0,.25);
}

#quizDisabledScreen h2 {
  color: #facc15;
  margin-bottom: 15px;
}

#quizDisabledScreen p {
  color: #cbd5e1;
  line-height: 1.6;
}

.quiz-container {
  position: relative;
  max-width: 950px;
  margin: auto;
  padding: 30px;
  box-sizing: border-box;
  border: 1px solid rgba(0,255,255,.25);
  border-radius: 24px;
  background: rgba(8,10,25,.96);
  box-shadow:
    0 0 25px rgba(0,255,255,.10),
    0 0 40px rgba(180,0,255,.08);
}

h1, h2 {
  text-align: center;
}

.quiz-container h1 {
  font-size: clamp(30px, 5vw, 52px);
  margin: 10px 0 30px;
  color: #fff;
  text-shadow: 0 0 20px rgba(0,255,255,.20);
}

.back-button,
.quiz-button {
  border: 0;
  border-radius: 12px;
  padding: 12px 18px;
  cursor: pointer;
  font-weight: bold;
  margin: 6px;
  transition: transform .12s ease, filter .12s ease;
}

.back-button {
  background: #334155;
  color: white;
}

.quiz-button {
  background: linear-gradient(135deg,#4f46e5,#9333ea);
  color: white;
  box-shadow: 0 0 12px rgba(124,58,237,.25);
}

.back-button:hover,
.quiz-button:hover {
  transform: translateY(-2px);
  filter: brightness(1.08);
}

.themes {
  display: grid !important;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px !important;
  margin-top: 22px !important;
}

.theme-card {
  position: relative;
  min-height: 110px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  padding: 20px 14px;
  border: 1px solid rgba(0,255,255,.22);
  border-radius: 16px;
  background: linear-gradient(145deg, #111b35, #180d2b);
  color: white;
  text-align: center;
  cursor: pointer;
  transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  box-shadow: 0 6px 18px rgba(0,0,0,.22);
}

.theme-card:hover {
  transform: translateY(-3px);
  border-color: #00ffff;
  box-shadow: 0 0 20px rgba(0,255,255,.22);
}

.theme-icon {
  font-size: 40px;
  margin-bottom: 8px;
  filter: drop-shadow(0 0 6px rgba(0,255,255,.45));
}

.theme-name {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .3px;
}

.theme-card.selected {
  border-color: #22c55e;
}

.difficulty {
  display: grid !important;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px !important;
  margin: 25px 0 !important;
}

.difficulty button {
  min-height: 70px;
  padding: 15px 20px;
  border: 1px solid rgba(255,255,255,.20);
  border-radius: 14px;
  color: white;
  cursor: pointer;
  font-weight: bold;
  transition: transform .12s ease, filter .12s ease;
}

.difficulty button:hover {
  transform: translateY(-2px);
  filter: brightness(1.08);
}

.easy {
  background: linear-gradient(135deg,#047857,#22c55e);
}

.hard {
  background: linear-gradient(135deg,#991b1b,#ef4444);
}

.impossible {
  background: linear-gradient(135deg,#581c87,#a855f7);
}

.question {
  margin-top: 22px !important;
  padding: 25px !important;
  border: 1px solid rgba(0,255,255,.22);
  border-radius: 20px !important;
  background: rgba(10,15,35,.97) !important;
  box-shadow:
    0 0 20px rgba(0,255,255,.08),
    inset 0 0 20px rgba(100,0,255,.05);
}

#questionText {
  font-size: clamp(21px, 3vw, 30px);
  line-height: 1.4;
}

.answers {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px !important;
  margin-top: 22px !important;
}

.answer {
  min-height: 70px;
  padding: 17px !important;
  border: 1px solid rgba(0,255,255,.18);
  border-radius: 14px !important;
  background: linear-gradient(135deg,#111827,#1e1b4b);
  color: white;
  cursor: pointer;
  text-align: left;
  font-size: 16px;
  font-weight: 700;
  transition: transform .10s ease, border-color .10s ease, box-shadow .10s ease;
}

.answer:hover {
  transform: translateY(-2px);
  border-color: #00ffff;
  box-shadow: 0 0 14px rgba(0,255,255,.20);
}

.answer.correct {
  background: linear-gradient(135deg,#065f46,#16a34a);
  border-color: #22c55e;
  box-shadow: 0 0 18px rgba(34,197,94,.35);
}

.answer.wrong {
  background: linear-gradient(135deg,#7f1d1d,#dc2626);
  border-color: #ef4444;
  box-shadow: 0 0 18px rgba(239,68,68,.30);
}

#progress {
  color: #67e8f9;
  font-weight: 800;
  letter-spacing: 1px;
}

#result {
  padding: 30px;
  border: 1px solid rgba(0,255,255,.25);
  border-radius: 20px;
  background: rgba(10,15,35,.96);
  box-shadow: 0 0 25px rgba(0,255,255,.10);
}

.hidden {
  display: none !important;
}

@media (max-width: 650px) {
  body {
    padding: 15px 10px;
  }

  .quiz-container {
    padding: 20px 14px;
  }

  .difficulty,
  .answers {
    grid-template-columns: 1fr;
  }

  .themes {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 10px !important;
  }

  .theme-card {
    min-height: 95px;
    padding: 16px 10px;
  }

  .theme-icon {
    font-size: 32px;
  }

  .theme-name {
    font-size: 14px;
  }
}
</style>




</head>
<body>

  <div id="quizDisabledScreen" class="hidden">
    <div class="maintenance-card">
      <h2>🔧 Quiz temporairement désactivé</h2>
      <p>
        L’administrateur effectue actuellement des modifications.<br>
        Merci de revenir un peu plus tard.
      </p>
    </div>
  </div>

  <div class="quiz-container">
    <button class="back-button" onclick="location.href='/'">⬅️ Retour</button>

    <h1>🎮 Quiz DiscuteApp</h1>

    <section id="themeScreen">
      <h2>Choisis ton thème</h2>
      <div class="themes" id="themes">
  <div class="theme-card">
    <div class="theme-icon">⏳</div>
    <div class="theme-name">Chargement des thèmes...</div>
  </div>
</div>
    </section>

    <section id="difficultyScreen" class="hidden">
      <h2 id="selectedTheme"></h2>
      <p style="text-align:center;">Choisis ta difficulté</p>

      <div class="difficulty" id="difficultyButtons">
        <div style="text-align:center;grid-column:1/-1;">⏳ Chargement des difficultés...</div>
      </div>

      <div style="text-align:center;">
        <button class="back-button" onclick="backToThemes()">⬅️ Changer de thème</button>
      </div>
    </section>

    <section id="quizScreen" class="hidden">
      <h2 id="quizTitle"></h2>
      <p id="progress" style="text-align:center;"></p>

      <div class="question">
        <h2 id="questionText"></h2>
        <div class="answers" id="answers"></div>
      </div>
    </section>

    <section id="resultScreen" class="hidden">
      <h2>🏁 Résultat du quiz</h2>
      <div id="result"></div>
      <div style="text-align:center;">
        <button class="quiz-button" onclick="backToThemes()">🎮 Rejouer</button>
        <button class="back-button" onclick="location.href='/'">🏠 Accueil</button>
      </div>
    </section>
  </div>

<script>
const questionBank = {
  "Culture générale": {
    facile: [
      ["Quelle est la capitale de la France ?", ["Paris", "Lyon", "Lille", "Nice"], 0],
      ["Combien de jours compte une semaine ?", ["5", "6", "7", "8"], 2],
      ["Quelle planète est surnommée la planète rouge ?", ["Mars", "Vénus", "Jupiter", "Saturne"], 0],
      ["Quel animal miaule ?", ["Chien", "Chat", "Cheval", "Vache"], 1],
      ["Combien font 5 + 5 ?", ["8", "9", "10", "11"], 2],
      ["Quelle est la couleur du ciel par beau temps ?", ["Vert", "Bleu", "Rouge", "Orange"], 1],
      ["Quel est le contraire de chaud ?", ["Froid", "Grand", "Rapide", "Lourd"], 0],
      ["Combien de côtés possède un triangle ?", ["2", "3", "4", "5"], 1],
      ["Quel fruit est généralement jaune ?", ["Banane", "Fraise", "Myrtille", "Cerise"], 0],
      ["Quelle langue parle-t-on principalement en France ?", ["Anglais", "Français", "Italien", "Allemand"], 1]
    ],
    difficile: [
      ["Quel est le symbole chimique de l’or ?", ["Ag", "Au", "Fe", "O"], 1],
      ["Qui a écrit Les Misérables ?", ["Victor Hugo", "Molière", "Zola", "Balzac"], 0],
      ["Quelle est la capitale de l’Australie ?", ["Sydney", "Melbourne", "Canberra", "Perth"], 2],
      ["Quel est le plus grand océan ?", ["Atlantique", "Pacifique", "Indien", "Arctique"], 1],
      ["En quelle année l’homme a-t-il marché sur la Lune pour la première fois ?", ["1959", "1969", "1979", "1989"], 1],
      ["Quel organe produit l’insuline ?", ["Le foie", "Le pancréas", "Le cœur", "Le rein"], 1],
      ["Qui a peint Guernica ?", ["Picasso", "Monet", "Rembrandt", "Dali"], 0],
      ["Quel est le nombre premier suivant 29 ?", ["30", "31", "32", "33"], 1],
      ["Quelle civilisation a construit Machu Picchu ?", ["Romaine", "Inca", "Égyptienne", "Viking"], 1],
      ["Quel gaz représente la plus grande partie de l’atmosphère terrestre ?", ["Oxygène", "Azote", "CO₂", "Hydrogène"], 1]
    ],
    impossible: [
      ["Quel philosophe a écrit Le Banquet ?", ["Platon", "Aristote", "Socrate", "Épicure"], 0],
      ["Quelle est la valeur approximative de la constante d’Avogadro ?", ["6,02 × 10²³", "9,81 × 10²", "3,14 × 10⁸", "1,60 × 10⁻¹⁹"], 0],
      ["Quel traité a créé la Communauté économique européenne en 1957 ?", ["Traité de Rome", "Traité de Versailles", "Traité de Maastricht", "Traité de Lisbonne"], 0],
      ["Qui a formulé les lois du mouvement et de la gravitation universelle ?", ["Newton", "Einstein", "Galilée", "Kepler"], 0],
      ["Quel écrivain est l’auteur de À la recherche du temps perdu ?", ["Proust", "Camus", "Sartre", "Flaubert"], 0],
      ["Quel est le plus petit nombre parfait ?", ["4", "6", "8", "10"], 1],
      ["Quelle unité mesure la résistance électrique ?", ["Volt", "Ampère", "Ohm", "Watt"], 2],
      ["Quel événement marque traditionnellement la fin de l’Antiquité ?", ["La chute de Rome en 476", "La Révolution française", "La découverte de l’Amérique", "La bataille de Waterloo"], 0],
      ["Quel mathématicien est associé au dernier théorème démontré en 1994 ?", ["Fermat", "Euclide", "Pythagore", "Pascal"], 0],
      ["Quelle langue ancienne est à l’origine du mot démocratie ?", ["Latin", "Grec", "Arabe", "Sanskrit"], 1]
    ]
  }
};

const themeNames = [
  "Culture générale",
  "Histoire",
  "Géographie",
  "Sciences",
  "Jeux vidéo",
  "Films et séries",
  "Musique",
  "Football",
  "Sports",
  "Animaux",
  "Nature",
  "Cuisine",
  "Jeux et logique",
  "Internet",
  "France",
  "Monde",
  "Espace",
  "Inventions",
  "Culture populaire",
  "Technologie"
];

let selectedTheme = "";

const difficultyConfig = {
  easy: {
    label: "🟢 Facile",
    code: "facile",
    className: "easy"
  },
  medium: {
    label: "🟡 Moyen",
    code: "moyen",
    className: "hard"
  },
  hard: {
    label: "🔴 Difficile",
    code: "difficile",
    className: "hard"
  }
};

async function loadQuizDifficulties() {
  const box = document.getElementById("difficultyButtons");

  try {
    const response = await fetch("/api/admin/quiz/settings", {
      credentials: "include"
    });

    if (!response.ok) {
      throw new Error("Impossible de charger les difficultés");
    }

    const data = await response.json();
    const difficulties = data.difficulties || [];

    box.innerHTML = "";

    const enabled = difficulties.filter(d => d.enabled);

    enabled.forEach(difficulty => {
      const config = difficultyConfig[difficulty.code];

      if (!config) return;

      const button = document.createElement("button");
      button.className = config.className;
      button.textContent = config.label;
      button.onclick = () => startQuiz(config.code);

      box.appendChild(button);
    });

    if (!enabled.length) {
      box.innerHTML =
        '<div style="text-align:center;grid-column:1/-1;">🚫 Aucune difficulté disponible.</div>';
    }
  } catch (error) {
    console.error("Erreur difficultés quiz :", error);
    box.innerHTML =
      '<div style="text-align:center;grid-column:1/-1;">Impossible de charger les difficultés.</div>';
  }
}
async function checkQuizStatus() {
  try {
    const response = await fetch("/api/admin/quiz/settings");
    const data = await response.json();

    const quizPage = document.querySelector(".quiz-container");
    const disabledPage = document.getElementById("quizDisabledScreen");

    if (data.enabled === false) {
      quizPage.classList.add("hidden");
      disabledPage.classList.remove("hidden");
    } else {
      quizPage.classList.remove("hidden");
      disabledPage.classList.add("hidden");
    }
  } catch (error) {
    console.error("Erreur de vérification du quiz :", error);
  }
}

checkQuizStatus();
loadQuizDifficulties();

let difficulty = "";
let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;

const themesBox = document.getElementById("themes");

async function loadQuizThemes() {
  try {
    const response = await fetch("/api/game/quiz/themes", {
      credentials: "include"
    });

    if (!response.ok) {
      throw new Error("Impossible de charger les thèmes");
    }

    const data = await response.json();

    themesBox.innerHTML = "";

    data.themes.forEach(theme => {
      const button = document.createElement("button");
      button.className = "theme-card";

      const icons = {
        "Culture générale": "🧠",
        "Histoire": "🏛️",
        "Géographie": "🌍",
        "Sciences": "🔬",
        "Jeux vidéo": "🎮",
        "Films et séries": "🎬",
        "Musique": "🎵",
        "Football": "⚽",
        "Sports": "🏆",
        "Animaux": "🐾",
        "Nature": "🌿",
        "Cuisine": "🍳",
        "Jeux et logique": "🧩",
        "Internet": "🌐",
        "France": "🇫🇷",
        "Monde": "🌎",
        "Espace": "🚀",
        "Inventions": "💡",
        "Culture populaire": "⭐",
        "Technologie": "💻"
      };

      button.innerHTML =
        '<div class="theme-icon">' + (icons[theme.name] || "🎯") + '</div>' +
        '<div class="theme-name">' + theme.name + '</div>';

      button.addEventListener("click", () => {
        selectedTheme = theme.name;
        document.getElementById("selectedTheme").textContent =
          "🎯 " + selectedTheme;
        document.getElementById("themeScreen").classList.add("hidden");
        document.getElementById("difficultyScreen").classList.remove("hidden");
      });

      themesBox.appendChild(button);
    });
  } catch (error) {
    console.error("Erreur thèmes quiz :", error);
    themesBox.innerHTML =
      "<p>Impossible de charger les thèmes du quiz.</p>";
  }
}

loadQuizThemes();

function backToThemes() {
  document.getElementById("themeScreen").classList.remove("hidden");
  document.getElementById("difficultyScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.add("hidden");
  selectedTheme = "";
}

function startQuiz(level) {
  difficulty = level;

  const theme = questionBank[selectedTheme];

  const levelMap = {
    facile: "facile",
    moyen: "difficile",
    difficile: "difficile"
  };

  const questionLevel = levelMap[level] || level;

  if (!theme || !theme[questionLevel]) {
    alert("Ce thème sera bientôt disponible. Choisis Culture générale pour tester les difficultés.");
    return;
  }

  questions = [...theme[questionLevel]]
    .sort(() => Math.random() - 0.5)
    .slice(0, 10);

  currentQuestion = 0;
  score = 0;

  document.getElementById("difficultyScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");
  document.getElementById("quizTitle").textContent =
    selectedTheme + " — " + difficulty;

  showQuestion();
}

function showQuestion() {
  answered = false;

  const question = questions[currentQuestion];

  document.getElementById("progress").textContent =
    "Question " + (currentQuestion + 1) + " / " + questions.length;

  document.getElementById("questionText").textContent = question[0];

  const answers = document.getElementById("answers");
  answers.innerHTML = "";

  question[1].forEach((answer, index) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = answer;
    button.onclick = () => answerQuestion(index, button);
    answers.appendChild(button);
  });
}

function answerQuestion(index, button) {
  if (answered) return;
  answered = true;

  const correct = questions[currentQuestion][2];
  const buttons = document.querySelectorAll(".answer");

  buttons[correct].classList.add("correct");

  if (index === correct) {
    score++;
  } else {
    button.classList.add("wrong");
  }

  setTimeout(() => {
    currentQuestion++;

    if (currentQuestion >= questions.length) {
      finishQuiz();
    } else {
      showQuestion();
    }
  }, 700);
}

async function finishQuiz() {
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  let reward = 0;

  if (score === 8) reward = 100;
  if (score === 9) reward = 250;
  if (score === 10) reward = 500;

  document.getElementById("result").innerHTML =
    "Tu as obtenu <strong>" + score + " / 10</strong><br><br>" +
    (reward > 0
      ? "🎉 Tu gagnes <strong>" + reward + " 💎</strong> !"
      : "😕 Il faut au moins 8 / 10 pour gagner des gemmes.");

  if (reward > 0) {
    try {
      await fetch("/api/game/quiz/reward", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          score,
          reward,
          theme: selectedTheme,
          difficulty
        })
      });
    } catch (error) {
      console.error("Récompense impossible :", error);
    }
  }
}

</script>

  <script src="question-bank-extra.js"></script>
</body>
</html>
