<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎒 Mon inventaire — DiscuteApp</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #3b2414;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.16), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(0,0,0,.12), transparent 30%),
        linear-gradient(135deg, #d8bd91, #a77b4d 45%, #76502f);
    }

    .market {
      min-height: 100vh;
      padding: 35px 20px 60px;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(70,40,15,.04) 0px,
          rgba(70,40,15,.04) 2px,
          transparent 2px,
          transparent 7px
        );
    }

    .header {
      max-width: 1100px;
      margin: 0 auto 30px;
      padding: 24px;
      text-align: center;
      background: #ead7b5;
      border: 4px solid #6b4426;
      border-radius: 18px;
      box-shadow:
        0 8px 0 #5a381f,
        0 14px 30px rgba(0,0,0,.3);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    .header p {
      margin: 0;
      font-size: 17px;
      color: #68472d;
    }

    .inventory {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
    }

    .card {
      position: relative;
      padding: 22px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(145deg, #f0dfbf, #d5b789);
      border: 3px solid #704827;
      border-radius: 16px;
      box-shadow:
        0 6px 0 #5b381f,
        0 12px 22px rgba(0,0,0,.25);
    }

    .card.equipped {
      border-color: #b47a1d;
      box-shadow:
        0 6px 0 #754c16,
        0 0 22px rgba(255,193,7,.45);
    }

    .icon {
      font-size: 48px;
      text-align: center;
      margin-bottom: 10px;
    }

    .card h2 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 21px;
    }

    .card p {
      flex: 1;
      margin: 0 0 18px;
      text-align: center;
      color: #67462b;
    }

    .status {
      text-align: center;
      margin-bottom: 12px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid #5c381e;
      border-radius: 10px;
      background: #8a5b32;
      color: #fff4df;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #4e2f19;
    }

    button:hover {
      background: #a36f40;
    }

    .equipped button {
      background: #b07a22;
    }

    .empty,
    .error {
      max-width: 700px;
      margin: 50px auto;
      padding: 30px;
      text-align: center;
      background: #ead7b5;
      border: 3px solid #704827;
      border-radius: 16px;
      font-size: 19px;
    }

    .back {
      max-width: 1100px;
      margin: 25px auto 0;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>
  <main class="market">
    <header class="header">
      <h1>🎒 Mon inventaire</h1>
      <p>⚔️ Le bazar médiéval de tes objets</p>
    </header>

    <section id="inventory" class="inventory">
      <div class="empty">📦 Chargement de ton inventaire...</div>
    </section>

    <div class="back">
      <button onclick="window.close()">✕ Fermer l'inventaire</button>
    </div>
  </main>

  <script>
    async function loadInventory() {
      const box = document.getElementById("inventory");

      try {
        const response = await fetch("/api/shop/inventory", {
          credentials: "include"
        });

        const data = await response.json();

        if (!response.ok) {
          box.innerHTML = `
            <div class="error">
              ❌ ${data.error || "Impossible de charger l'inventaire."}
            </div>
          `;
          return;
        }

        const items = Array.isArray(data.items) ? data.items : [];

        if (!items.length) {
          box.innerHTML = `
            <div class="empty">
              🎒 Ton inventaire est vide.<br><br>
              🛒 Va acheter quelques objets dans la boutique !
            </div>
          `;
          return;
        }

        box.innerHTML = items.map(item => {
          const equipped = !!item.equipped;

          return `
            <article class="card ${equipped ? "equipped" : ""}">
              <div class="icon">${item.emoji || "🎁"}</div>

              <h2>${escapeHtml(item.name || "Objet")}</h2>

              <p>${escapeHtml(item.description || "Objet de ton inventaire.")}</p>

              <div class="status">
                ${equipped ? "🟢 Activé" : "⚪ Désactivé"}
              </div>

              <button onclick="toggleItem(${item.id}, ${equipped ? 0 : 1})">
                ${equipped ? "⚪ Désactiver" : "🟢 Activer"}
              </button>
            </article>
          `;
        }).join("");

      } catch (error) {
        box.innerHTML = `
          <div class="error">
            ❌ Erreur de connexion au serveur.
          </div>
        `;
      }
    }

    async function toggleItem(itemId, equipped) {
      try {
        const response = await fetch("/api/shop/equip", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            itemId,
            equipped
          })
        });

        const data = await response.json();

        if (!response.ok) {
          alert("❌ " + (data.error || "Impossible de modifier l'objet."));
          return;
        }

        await loadInventory();

      } catch {
        alert("❌ Erreur de connexion.");
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadInventory();
  </script>
</body>
</html>
